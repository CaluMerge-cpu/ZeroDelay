# Builds ZeroDelay-Setup.exe on Windows, checks the app starts, installs it like an update, and renders screenshots.
# The setup file and screenshots are kept as the run's artifacts; publishing a release stays a manual step.
name: Build

on:
  push:
    branches: [main, 'redesign-*']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # two Windows releases (Server 2025 = 24H2 build 26100, Server 2022 = build 20348): the build-gated cards differ
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Parse the script with Windows PowerShell 5.1
        shell: powershell
        run: |
          $t = $null; $e = $null
          [void][Management.Automation.Language.Parser]::ParseFile("$PWD\ZeroDelay.ps1", [ref]$t, [ref]$e)
          if ($e) { $e | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          'No parse errors.'

      - name: Build the installer
        shell: powershell
        run: .\build.ps1

      - name: Render every main page in real WPF
        id: render
        continue-on-error: true
        shell: powershell
        env:
          ZD_FAKE_MATCH: '1'
        run: |
          $out = New-Item -ItemType Directory -Force snapshots
          $pages = 'New', 'Home', 'Games', 'Boost', 'Tweaks', 'Checks', 'Tools', 'GameMode', 'Events', 'Fortnite', 'CS2', 'Valorant', 'Apps'
          $failed = @()
          foreach ($p in $pages) {
            $png = Join-Path $out "$p.png"
            # the Apps list is read in the background: give it time before the picture is taken
            $env:ZD_SNAPWAIT = if ($p -eq 'Apps') { '20' } else { $null }
            $proc = Start-Process powershell.exe -PassThru -NoNewWindow -RedirectStandardError "$out\$p.err.txt" -ArgumentList @(
              '-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "$PWD\ZeroDelay.ps1", '-NoElevate', '-Snapshot', $png, '-Page', $p)
            if (-not $proc.WaitForExit(180000)) {
              # what is on screen when it hangs (a dialog waiting for a click, for example)
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [Windows.Forms.SystemInformation]::VirtualScreen; $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
              $g = [Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size); $bmp.Save("$out\$p-timeout-screen.png"); $g.Dispose(); $bmp.Dispose()
              Get-Process | Where-Object { $_.MainWindowTitle } | ForEach-Object { "window: $($_.ProcessName) [$($_.MainWindowTitle)]" }
              Stop-Process -Id $proc.Id -Force; $failed += "$p (timed out)"; continue
            }
            $err = Get-Content "$out\$p.err.txt" -Raw -ErrorAction SilentlyContinue
            if (-not (Test-Path $png) -or (Get-Item $png).Length -lt 10000) { $failed += "$p (no image)" }
            if ($err) { "--- $p stderr ---"; $err }
          }
          Get-ChildItem $out *.png | ForEach-Object { "{0,-14} {1,9:N0} bytes" -f $_.Name, $_.Length }
          if ($failed) { "Failed: $($failed -join ', ')"; exit 1 }

      - name: Switch every registry and power tweak on and off, and check nothing is left behind
        shell: powershell
        env:
          ZD_ROUNDTRIP: '1'
        run: |
          $png = "$PWD\snapshots\roundtrip.png"
          $p = Start-Process powershell.exe -PassThru -NoNewWindow -ArgumentList @(
            '-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "$PWD\ZeroDelay.ps1", '-NoElevate', '-Snapshot', $png)
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; throw 'Timed out.' }
          $r = @(Get-Content "$png.roundtrip.txt" -ErrorAction Stop)
          $r
          $ok = @($r | Where-Object { $_ -like 'OK*' }).Count; $fail = @($r | Where-Object { $_ -like 'FAIL*' })
          "`n$ok switched on and back off cleanly, $($fail.Count) failed, $(@($r | Where-Object { $_ -like 'SKIP*' }).Count) skipped (not applicable here or already on)."
          if ($fail.Count) { exit 1 }

      - name: Performance modes (presets, power plans, power mode slider, Game Mode) applied and undone
        id: modes
        continue-on-error: true
        shell: powershell
        env:
          ZD_MODES: '1'
        run: |
          $out = New-Item -ItemType Directory -Force snapshots
          $png = Join-Path $out 'modes.png'
          $p = Start-Process powershell.exe -PassThru -NoNewWindow -RedirectStandardError "$out\modes.err.txt" -ArgumentList @(
            '-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "$PWD\ZeroDelay.ps1", '-NoElevate', '-Snapshot', $png)
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; throw 'Timed out after 15 minutes.' }
          $f = "$png.modes.txt"
          if (-not (Test-Path $f)) { Get-Content "$out\modes.err.txt" -ErrorAction SilentlyContinue; throw 'No modes report was written.' }
          $r = @(Get-Content $f); $r
          $fail = @($r | Where-Object { $_ -like 'FAIL*' })
          "`n$(@($r | Where-Object { $_ -like 'OK*' }).Count) passed, $($fail.Count) failed."
          if ($fail.Count) { exit 1 }

      - name: How much CPU and memory ZeroDelay itself uses while open
        continue-on-error: true
        shell: powershell
        run: |
          # the real app, not a snapshot: live tiles, timers and the background worker all running
          $p = Start-Process powershell.exe -PassThru -ArgumentList @('-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "$PWD\ZeroDelay.ps1", '-NoElevate')
          Start-Sleep -Seconds 60
          if ($p.HasExited) { throw "ZeroDelay exited by itself (code $($p.ExitCode))." }
          $cores = [Environment]::ProcessorCount
          $ids = @($p.Id) + @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object { $_.ProcessId })
          $cpu0 = (Get-Process -Id $ids -ErrorAction SilentlyContinue | Measure-Object CPU -Sum).Sum
          Start-Sleep -Seconds 30
          $procs = @(Get-Process -Id $ids -ErrorAction SilentlyContinue)
          $cpu1 = ($procs | Measure-Object CPU -Sum).Sum
          $pct = [Math]::Round(100 * ($cpu1 - $cpu0) / 30 / $cores, 2)
          $mb = [Math]::Round(($procs | Measure-Object WorkingSet64 -Sum).Sum / 1MB)
          "ZeroDelay open and idle for 30 s: $pct% of the whole CPU ($cores cores), $mb MB of memory."
          Stop-Process -Id $ids -Force -ErrorAction SilentlyContinue
          if ($pct -gt 3) { "Over 3% CPU while idle."; exit 1 }

      - name: Simulate different PCs (graphics, drivers, network, games, other apps, broken WMI) and check every card and page
        id: pcmatrix
        continue-on-error: true
        shell: powershell
        env:
          ZD_PCMATRIX: '1'
        run: |
          $out = New-Item -ItemType Directory -Force snapshots
          $png = Join-Path $out 'pcmatrix.png'
          $p = Start-Process powershell.exe -PassThru -NoNewWindow -RedirectStandardError "$out\pcmatrix.err.txt" -ArgumentList @(
            '-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "$PWD\ZeroDelay.ps1", '-NoElevate', '-Snapshot', $png)
          if (-not $p.WaitForExit(1800000)) { Stop-Process -Id $p.Id -Force; 'Timed out after 30 minutes.' }
          $f = "$png.pcmatrix.txt"
          if (-not (Test-Path $f)) { '--- stderr ---'; Get-Content "$out\pcmatrix.err.txt" -ErrorAction SilentlyContinue; throw 'No pcmatrix report was written.' }
          $r = @(Get-Content $f)
          $r
          $bad = @($r | Where-Object { $_ -match '^(ERROR|SLOW) ' })
          if (-not ($r | Where-Object { $_ -like 'SUMMARY*' })) { throw 'The matrix stopped before the end (no SUMMARY line).' }
          if ($bad.Count) { "`n$($bad.Count) problem(s): an exception or a call over 3 s on a simulated PC (see the section above each line)."; exit 1 }
          "`nEvery simulated PC: no exceptions, no call over 3 s."

      - name: Render the What's new window
        shell: powershell
        env:
          ZD_WHATSNEW: '1'
        run: |
          $p = Start-Process powershell.exe -PassThru -NoNewWindow -ArgumentList @(
            '-NoProfile', '-STA', '-ExecutionPolicy', 'Bypass', '-File', "$PWD\ZeroDelay.ps1", '-NoElevate', '-Snapshot', "$PWD\snapshots\WhatsNew.png")
          if (-not $p.WaitForExit(180000)) { Stop-Process -Id $p.Id -Force; 'Timed out (the dialog may wait for a click); not a build failure.' }

      - name: Install as an update and check the installed files
        shell: powershell
        run: |
          $p = Start-Process .\dist\ZeroDelay-Setup.exe -ArgumentList '/update' -PassThru
          if (-not $p.WaitForExit(300000)) { throw 'Setup did not finish in 5 minutes.' }
          "Setup exit code: $($p.ExitCode)"
          Start-Sleep 5
          Get-Process ZeroDelay -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-CimInstance Win32_Process -Filter "Name='powershell.exe'" | Where-Object { $_.CommandLine -match 'ZeroDelay\.ps1' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $dir = Join-Path $env:ProgramFiles 'ZeroDelay'
          Get-ChildItem $dir | Select-Object Name, Length | Format-Table -AutoSize | Out-String
          $v = Select-String -LiteralPath (Join-Path $dir 'ZeroDelay.ps1') -Pattern "^\`$AppVersion = '([^']+)'" | ForEach-Object { $_.Matches[0].Groups[1].Value }
          "Installed version: $v"
          if ($p.ExitCode -ne 0) { throw "Setup exited with $($p.ExitCode)." }
          if (-not $v) { throw 'ZeroDelay.ps1 is not in Program Files after setup.' }

      - name: Fail the run if a page did not render
        if: steps.render.outcome == 'failure'
        shell: powershell
        run: |
          'A page did not render; see "Render every main page in real WPF" and the snapshots artifact.'
          exit 1

      - name: Fail the run if a simulated PC hit an exception or a slow call
        if: steps.pcmatrix.outcome == 'failure'
        shell: powershell
        run: |
          'A simulated PC failed; see "Simulate different PCs" and the pcmatrix artifact.'
          exit 1

      - name: Fail the run if a performance mode did not undo cleanly
        if: steps.modes.outcome == 'failure'
        shell: powershell
        run: |
          'A performance mode left something changed; see "Performance modes".'
          exit 1

      - name: Checksum
        shell: powershell
        run: (Get-FileHash .\dist\ZeroDelay-Setup.exe -Algorithm SHA256).Hash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZeroDelay-Setup-${{ matrix.os }}
          path: dist/ZeroDelay-Setup.exe
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots-${{ matrix.os }}
          path: snapshots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pcmatrix-${{ matrix.os }}
          path: snapshots/pcmatrix.png.pcmatrix.txt
          if-no-files-found: ignore
